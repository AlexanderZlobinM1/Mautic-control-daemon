[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-agent"
version = "1.6.35"
description = "MauticControlDaemon host agent"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "PyMySQL>=1.1.1",
  "phpserialize>=1.3",
  "cryptography>=42.0.0",
]

[project.scripts]
mcd-agent = "mcd_agent.cli:main"
mcd-cli = "mcd_agent.cli:main"
mcd-scenario-runner = "mcd_agent.scenario_launcher:main"
mcd-commercial-key = "mcd_agent.commercial_manual_activation:main"

[tool.setuptools.packages.find]
include = ["mcd_agent*"]

[tool.setuptools]
py-modules = ["sitecustomize"]

[tool.setuptools.package-data]
mcd_agent = ["templates/nginx/*.conf", "contracts/*.json", "contracts/fixtures/*.json"]
