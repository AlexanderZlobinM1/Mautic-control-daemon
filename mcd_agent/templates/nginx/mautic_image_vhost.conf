server {
    listen 80;
    server_name {{DOMAIN}};
    root {{WEB_ROOT}};
    index index.php index.html;
    client_max_body_size 128M;

    location ^~ /.well-known/acme-challenge/ {
        root {{WEB_ROOT}};
        default_type "text/plain";
        try_files $uri =404;
        allow all;
    }

{{HTTP_ROOT_LOCATION}}

{{FORM_EMBED_HTTP_LOCATION}}

{{MAUTIC_DENY_LOCATIONS}}
}

{{SSL_SERVER_BLOCK}}
